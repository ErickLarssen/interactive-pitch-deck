  return async (req: Request, res: Response): Promise<void> => {
    await assertCepInServiceArea(cepProvider, req.body.enderecoColeta.cep, "enderecoColeta.cep");
    const collection = await createCollection(userId(req), req.body);
    // Coletores ativos são avisados da nova coleta disponível (DEC-084).
    await notifyCollectorsOfNewCollection(collection.id);
    sendSuccess(res, 201, "Coleta solicitada com sucesso.", { collection });
  };
}`,description:"Rota Express que recebe a solicitação, valida se o CEP está na área atendida e cria a coleta no banco.",screenshot:{src:"./assets/images/code/code-dashboard-coleta.jpg",alt:"Painel do cliente EcoByte mostrando coletas recém-criadas, rodando localmente",caption:"Painel do cliente — cada card aqui é uma coleta que passou por essa rota."}},{id:"code-mongo",label:"MongoDB",iconKey:"mongodb",filePath:"backend/src/models/collection.model.ts",language:"ts",code:`// Coleção \`collections\` (07_DATABASE_MONGODB §14, DEC-061).
